    <title>scriptorium</title>
    <!-- Pre-paint theme: stored choice > OS preference > dark. Mirrors
         state/theme.ts resolveInitialTheme — keep the two in sync by hand. -->
    <script>
      (() => {
        let t = null;
        try {
          t = localStorage.getItem("scriptorium:theme");
        } catch {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- Pre-boot ground so a cold dev open does not flash. LITERALS on purpose:
         no token exists until styles.css loads; these mirror --color-bg. -->
    <style>
      html {
        color-scheme: dark;
        background-color: #15130f;
      }
      html[data-theme="light"] {
        color-scheme: light;
        background-color: #f6f1e7;
      }
    </style>
