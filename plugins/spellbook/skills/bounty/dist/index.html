<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A placeholder only. The board's real title arrives on the WebSocket
         `init` frame, which sets both this and the <h1> (it always did — the
         old page's server-substituted title was only the pre-connect seed). -->
    <title>bounty</title>
    <!-- Pre-boot ground so a cold dev open (Bun bundles lazily) does not flash
         white before styles.css arrives. A LITERAL on purpose: no token exists
         until the stylesheet loads, so this mirrors `--color-bg` in styles.css
         (#16100b) and must move with it. -->
    <style>
      html {
        color-scheme: dark;
        background-color: #16100b;
      }
    </style>
    
    <!-- The real icon is /assets/favicon.png, which the DAEMON serves — it is
         not a build input and Bun's HTML bundler would try to resolve it off
         disk. So this ships as an empty placeholder (which also stops the
         browser default-probing /favicon.ico before the module runs) and
         main.tsx points it at the served path on boot. -->
    <link rel="icon" href="data:," />
